<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Data Dashboard - Performance Edition</title>
    <!-- uPlot CSS (Die einzige externe Datei neben dem uPlot JS) -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label {
            font-size: 13px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #aaa;
        }
        input, button {
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover {
            background: #3d3d3d;
        }
        button.active {
            background: #d32f2f;
            border-color: #f44336;
        }
        .btn-pause {
            background: #0288d1;
            border-color: #03a9f4;
        }
        .btn-pause.paused {
            background: #388e3c;
            border-color: #4caf50;
        }
        .chart-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .stats-panel {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
        .stats-panel strong {
            color: #fff;
        }
        /* Lokale Anpassung für uPlot Legend / Dark Mode */
        .u-legend th { color: #aaa; }
        .u-legend { bottom: -30px !important; top: auto !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sensor Live-Daten (80 Hz)</h2>

    <div class="controls">
        <label>
            Moving Average Fenster:
            <input type="number" id="maWindow" value="40" min="1" max="2000">
        </label>
        <label>
            Max. Buffer-Größe (Werte):
            <input type="number" id="maxBufferInput" value="50000" min="1000" step="1000">
        </label>

        <button id="tareBtn">Tare (Nullpunkt)</button>
        <button id="pauseBtn" class="btn-pause">Pause (Chart einfrieren)</button>
        <button id="exportBtn">CSV Export</button>

        <div style="margin-left: auto; text-align: right;" class="stats-panel">
            <div>Offset: <strong id="offsetVal">0.00</strong></div>
            <div>Buffer: <strong id="bufferCount">0</strong> / <strong id="bufferMaxDisplay">50000</strong></div>
        </div>
    </div>

    <div class="chart-container">
        <div id="chart"></div>
    </div>
</div>

<!-- uPlot JS -->
<script src="https://jsdelivr.net"></script>

<script>
    // --- State & Unendlicher Buffer ---
    const rawBuffer = {
        times: [],
        values: []
    };

    // Konfigurationen
    let maWindowSize = parseInt(document.getElementById('maWindow').value, 10);
    let maxBufferSize = parseInt(document.getElementById('maxBufferInput').value, 10);
    let tareOffset = 0;
    let isPaused = false;

    // --- DOM Elemente & Event Listener ---
    const maInput = document.getElementById('maWindow');
    const maxBufferInput = document.getElementById('maxBufferInput');
    const tareBtn = document.getElementById('tareBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const exportBtn = document.getElementById('exportBtn');
    const offsetVal = document.getElementById('offsetVal');
    const bufferCount = document.getElementById('bufferCount');
    const bufferMaxDisplay = document.getElementById('bufferMaxDisplay');

    maInput.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        if (val > 0) maWindowSize = val;
    });

    maxBufferInput.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        if (val >= 1000) {
            maxBufferSize = val;
            bufferMaxDisplay.textContent = val;
        }
    });

    tareBtn.addEventListener('click', () => {
        if (rawBuffer.values.length > 0) {
            // Verwendet den letzten unkorrigierten Wert aus dem Buffer als Nullpunkt
            tareOffset = rawBuffer.values[rawBuffer.values.length - 1];
            offsetVal.textContent = tareOffset.toFixed(2);
            tareBtn.classList.add('active');
        }
    });

    pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
            pauseBtn.textContent = "Fortsetzen (Live)";
            pauseBtn.classList.add('paused');
        } else {
            pauseBtn.textContent = "Pause (Chart einfrieren)";
            pauseBtn.classList.remove('paused');
            // Direkt nach dem Entpausieren Chart auf den neuesten Stand bringen
            updateChart();
        }
    });

    exportBtn.addEventListener('click', () => {
        exportToCSV();
    });

    // --- Datenverarbeitung & Transformation (Nur bei Anzeige oder Export) ---
    function prepareChartData(limitToViewport = false) {
        let t = rawBuffer.times;
        let vRaw = rawBuffer.values;

        // Wenn der Chart läuft, limitieren wir die X-Achsen-Ansicht für flüssiges Zeichnen (z.B. letzte 800 Werte ~10 Sek)
        // Im Hintergrund wächst der rawBuffer trotzdem weiter an.
        if (limitToViewport && t.length > 800) {
            const startIdx = t.length - 800;
            t = t.slice(startIdx);
            vRaw = vRaw.slice(startIdx);
        }

        const vTared = [];
        const vMA = [];
        const vBandUpper = [];
        const vBandLower = [];

        for (let i = 0; i < vRaw.length; i++) {
            const currentTared = vRaw[i] - tareOffset;
            vTared.push(currentTared);

            const start = Math.max(0, i - maWindowSize + 1);
            const windowValues = vTared.slice(start, i + 1);
            const sum = windowValues.reduce((a, b) => a + b, 0);
            const avg = sum / windowValues.length;
            vMA.push(avg);

            const variance = windowValues.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / windowValues.length;
            const stdDev = Math.sqrt(variance);

            vBandUpper.push(avg + stdDev);
            vBandLower.push(avg - stdDev);
        }

        return [t, vTared, vMA, vBandUpper, vBandLower];
    }

    // --- uPlot Konfiguration ---
    const opts = {
        title: "",
        width: 1060,
        height: 450,
        ms: 1,
        series: [
            {},
            { label: "Sensor (Tared)", stroke: "#4fc3f7", width: 1 },
            { label: "Moving Average", stroke: "#ffb74d", width: 2.5 },
            { label: "Streuung Oberseite", stroke: "transparent", width: 0 },
            { label: "Streuung Unterseite", stroke: "transparent", width: 0, fill: "rgba(255, 183, 77, 0.12)" }
        ],
        bands: [ {series:} ],
        axes: [
            { grid: { stroke: "#2d2d2d" }, stroke: "#888" },
            { grid: { stroke: "#2d2d2d" }, stroke: "#888" }
        ],
        cursor: { drag: { setScale: false } }
    };

    const chartDiv = document.getElementById("chart");
    let chart = new uPlot(opts, [[], [], [], [], []], chartDiv);

    // --- UI Update Logik ---
    function updateChart() {
        if (isPaused) return;

        // Transformiert nur den für das Auge relevanten Zeitausschnitt für uPlot
        const updatedData = prepareChartData(true);
        chart.setData(updatedData);
    }

    // --- Daten-Injektion (Echtzeit-Verarbeitung von SSE) ---
    function handleIncomingData(timestamp, value) {
        rawBuffer.times.push(timestamp);
        rawBuffer.values.push(value);

        // Greift erst, wenn das vom User gesetzte, sehr große Limit erreicht wird
        if (rawBuffer.times.length > maxBufferSize) {
            rawBuffer.times.shift();
            rawBuffer.values.shift();
        }

        // Counter aktualisieren
        bufferCount.textContent = rawBuffer.times.length;

        // Chart rendern (uPlot minimiert die DOM-Last automatisch)
        updateChart();
    }

    // --- CSV Export (Nutzt den vollen, unveränderten Buffer) ---
    function exportToCSV() {
        if (rawBuffer.times.length === 0) return alert("Keine Daten zum Exportieren vorhanden.");

        let csvContent = "data:text/csv;charset=utf-8,Timestamp_Unix,Raw_Value\n";

        for (let i = 0; i < rawBuffer.times.length; i++) {
            csvContent += `${rawBuffer.times[i]},${rawBuffer.values[i]}\n`;
        }

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `sensor_data_export_${Math.floor(Date.now()/1000)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- SSE Emulator (80 Hz) ---
    function startSimulation() {
        let count = 0;
        const intervalMs = 1000 / 80;
        setInterval(() => {
            const now = Date.now() / 1000;
            const baseValue = 100 + Math.sin(count * 0.03) * 20;
            const noise = (Math.random() - 0.5) * 12;
            const fakeSensorValue = baseValue + noise;
            handleIncomingData(now, fakeSensorValue);
            count++;
        }, intervalMs);
    }
    startSimulation();

        const data = JSON.parse(event.data);
        const now = Date.now() / 1000;
        handleIncomingData(now, parseFloat(data.value));
    };
    */

</script>
</body>
</html>
