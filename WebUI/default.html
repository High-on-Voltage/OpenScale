<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- uPlot CSS (Embedded via latest CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
    <style>
        @charset "utf-8";
        .uplot {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            user-select: none;
        }
        .u-title {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            margin: 2px 0;
            color: #cbd5e1;
        }
        .uplot, .uplot * {
            box-sizing: border-box;
        }
        .u-axis text {
            fill: #cbd5e1;
        }
        /* Enable and style built-in uPlot legend supporting series toggling via click */
        .u-legend {
            text-align: left;
            margin: 4px 0 0 0;
            padding: 0;
            font-size: 12px;
            color: #cbd5e1;
        }
        .u-legend tr {
            margin-right: 12px;
            display: inline-block;
            cursor: pointer;
        }
        .u-legend tr.disabled {
            opacity: 0.4;
        }
        .u-legend th {
            font-weight: normal;
            color: #94a3b8;
        }
        .u-legend td {
            padding: 0 4px;
        }

        /* App Layout Styles */
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }
        body {
            margin: 0;
            padding: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            background: var(--panel-bg);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        h1 {
            font-size: 16px;
            margin: 0;
        }
        .controls-top {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            margin-bottom: 8px;
            flex-shrink: 0;
            font-size: 12px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-group label {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-weight: 500;
        }
        input, select, button {
            background: #0f172a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        input[type="range"] {
            padding: 0;
            cursor: pointer;
        }
        button {
            cursor: pointer;
            background: var(--accent-color);
            border: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        button.secondary {
            background: #475569;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 8px;
            min-height: 0;
        }
        .chart-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            min-width: 0;
            min-height: 0;
        }

        /* Flex containers for charts to prevent overflow and fill vertical space cleanly */
        .chart-wrapper-main {
            flex: 3;
            min-height: 0;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .chart-wrapper-nav {
            flex: 1;
            min-height: 50px;
            max-height: 80px;
            position: relative;
            display: flex;
            flex-direction: column;
            margin-top: 4px;
        }

        #main-chart, #nav-chart {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>High-Frequency Sensor Telemetry (80 Hz SSE)</h1>
        <div style="display: flex; gap: 8px;">
            <button id="btn-pause">Pause UI</button>
            <button id="btn-live" class="secondary">Track Live</button>
            <button id="btn-tare" class="secondary">Auto-Tare</button>
            <button id="btn-export" class="secondary">Export CSV</button>
        </div>
    </header>

    <!-- Top Configuration & Stats Bar -->
    <div class="controls-top">
        <div class="control-group">
            <label>Buffer Limit <input type="number" id="in-limit" value="100000" step="10000" min="1000" style="width: 80px;"></label>
        </div>
        <div class="control-group">
            <label>MA Window <input type="number" id="in-window" value="40" min="1" max="1000" style="width: 60px;"></label>
        </div>
        <div class="control-group">
            <label>Tare Offset <input type="number" id="in-tare" value="0" step="0.1" style="width: 70px;"></label>
        </div>
        <div style="border-left: 1px solid var(--border-color); height: 20px; margin: 0 2px;"></div>
        <div class="control-group">
            <label><input type="checkbox" id="chk-fill-zero" style="margin-bottom:2px;"> Fill 0 to Lower Spread</label>
        </div>
        <div style="border-left: 1px solid var(--border-color); height: 20px; margin: 0 2px;"></div>
        <div class="control-group">
            <label><input type="checkbox" id="chk-manual-y" style="margin-bottom:2px;"> Manual Y-Axis</label>
        </div>
        <div class="control-group">
            <label>Y-Min <input type="range" id="rng-ymin" min="-200" max="200" value="-50" disabled style="width: 80px;"></label>
            <span id="lbl-ymin" style="font-family: monospace; width: 30px; text-align: right;">-50</span>
        </div>
        <div class="control-group">
            <label>Y-Max <input type="range" id="rng-ymax" min="-200" max="200" value="50" disabled style="width: 80px;"></label>
            <span id="lbl-ymax" style="font-family: monospace; width: 30px; text-align: right;">50</span>
        </div>
        <div style="border-left: 1px solid var(--border-color); height: 20px; margin: 0 2px;"></div>
        <div class="control-group" style="font-family: monospace; font-size: 11px; color: #94a3b8;">
            Samples: <span id="stat-count" style="color: var(--text-color); font-weight: bold;">0</span> / <span id="stat-limit">100000</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Visualization Area -->
        <div class="chart-area">
            <div class="chart-wrapper-main">
                <div id="main-chart"></div>
            </div>
            <div class="chart-wrapper-nav">
                <div id="nav-chart"></div>
            </div>
        </div>
    </div>

    <!-- uPlot Library Inclusion (Latest CDN v1.6.31) -->
    <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>

    <script>
        /**
         * High-Frequency Sensor Visualization Engine
         * Implements O(N) single-pass sliding window metrics & uPlot synchronization.
         */

        // Global State & Data Buffers
        const state = {
            maxBufferSize: 100000,
            windowSize: 40,
            tareOffset: 0,
            isPaused: false,
            isLive: true,
            liveWindowSpan: 10,
            fillZeroToLower: false,
            manualY: false,
            yMin: -50,
            yMax: 50
        };

        const baseTimestamp = Math.floor(Date.now() / 1000);

        // Raw append buffer
        let timesBuffer = new Float64Array(100000);
        let rawValuesBuffer = new Float64Array(100000);
        let bufferLength = 0;

        // DOM Elements
        const elLimit = document.getElementById('in-limit');
        const elWindow = document.getElementById('in-window');
        const elTare = document.getElementById('in-tare');
        const elPause = document.getElementById('btn-pause');
        const elLive = document.getElementById('btn-live');
        const elAutoTare = document.getElementById('btn-tare');
        const elExport = document.getElementById('btn-export');
        const elFillZero = document.getElementById('chk-fill-zero');
        const elManualY = document.getElementById('chk-manual-y');
        const elRngYMin = document.getElementById('rng-ymin');
        const elRngYMax = document.getElementById('rng-ymax');
        const lblYMin = document.getElementById('lbl-ymin');
        const lblYMax = document.getElementById('lbl-ymax');
        const statCount = document.getElementById('stat-count');
        const statLimit = document.getElementById('stat-limit');

        function resizeBuffers(newSize) {
            state.maxBufferSize = newSize;
            statLimit.textContent = newSize;
            const newTimes = new Float64Array(newSize);
            const newVals = new Float64Array(newSize);

            const copyLen = Math.min(bufferLength, newSize);
            if (copyLen > 0) {
                const startIdx = Math.max(0, bufferLength - newSize);
                newTimes.set(timesBuffer.subarray(startIdx, bufferLength));
                newVals.set(rawValuesBuffer.subarray(startIdx, bufferLength));
                bufferLength = copyLen;
            } else {
                bufferLength = 0;
            }
            timesBuffer = newTimes;
            rawValuesBuffer = newVals;
            statCount.textContent = bufferLength;
        }

        function pushSample(t, v) {
            if (bufferLength >= state.maxBufferSize) {
                timesBuffer.copyWithin(0, 1);
                rawValuesBuffer.copyWithin(0, 1);
                timesBuffer[state.maxBufferSize - 1] = t;
                rawValuesBuffer[state.maxBufferSize - 1] = v;
            } else {
                timesBuffer[bufferLength] = t;
                rawValuesBuffer[bufferLength] = v;
                bufferLength++;
            }
            statCount.textContent = bufferLength;
        }

        function computeDerivedData() {
            const w = Math.max(1, state.windowSize);
            const tArray = new Float64Array(bufferLength);
            const rawTared = new Float64Array(bufferLength);
            const maArray = new Float64Array(bufferLength);
            const upperBand = new Float64Array(bufferLength);
            const lowerBand = new Float64Array(bufferLength);

            let sum = 0;
            let sumSq = 0;

            for (let i = 0; i < bufferLength; i++) {
                const val = rawValuesBuffer[i] - state.tareOffset;
                tArray[i] = baseTimestamp + timesBuffer[i];
                rawTared[i] = val;

                sum += val;
                sumSq += val * val;

                if (i >= w) {
                    const oldVal = rawValuesBuffer[i - w] - state.tareOffset;
                    sum -= oldVal;
                    sumSq -= oldVal * oldVal;
                }

                const currentWindowSize = Math.min(i + 1, w);
                const mean = sum / currentWindowSize;
                maArray[i] = mean;

                let variance = (sumSq / currentWindowSize) - (mean * mean);
                if (variance < 0) variance = 0;
                const stdDev = Math.sqrt(variance);

                upperBand[i] = mean + stdDev;
                lowerBand[i] = mean - stdDev;
            }

            return [tArray, rawTared, maArray, upperBand, lowerBand];
        }

        let mainPlot = null;
        let navPlot = null;

        // Custom plugin for wheel zoom on X-axis
        function wheelZoomPlugin() {
            return {
                hooks: {
                    ready: (u) => {
                        let over = u.over;
                        let rect = over.getBoundingClientRect();

                        over.addEventListener("wheel", e => {
                            e.preventDefault();
                            let left = e.clientX - rect.left;
                            let cx = u.posToVal(left, 'x');
                            let xMin = u.scales.x.min;
                            let xMax = u.scales.x.max;
                            let xrange = xMax - xMin;

                            let factor = e.deltaY < 0 ? 0.9 : 1.1;
                            let newRange = xrange * factor;

                            let minX = cx - (cx - xMin) * factor;
                            let maxX = minX + newRange;

                            if (state.isLive) {
                                state.liveWindowSpan = maxX - minX;
                            }

                            u.setScale('x', { min: minX, max: maxX });
                        });
                    }
                }
            };
        }

        function createMainPlot() {
            const [t, raw, ma, upper, lower] = computeDerivedData();
            const mainContainer = document.getElementById('main-chart');

            const mainOpts = {
                title: "Real-Time Sensor Feed (80 Hz)",
                width: mainContainer.clientWidth || 800,
                height: mainContainer.clientHeight || 150,
                cursor: {
                    show: true,
                },
                select: {
                    show: true,
                    over: true,
                    fill: "rgba(59, 130, 246, 0.2)"
                },
                scales: {
                    x: { time: true },
                    y: {
                        range: (u, min, max) => {
                            if (state.manualY) {
                                return [state.yMin, state.yMax];
                            }
                            let absMin = Math.min(0, min);
                            let absMax = Math.max(0, max);
                            let padding = (absMax - absMin) * 0.1 || 1;
                            return [absMin - padding, absMax + padding];
                        }
                    }
                },
                // Correct root-level bands to fill strictly between Upper (3) and Lower (4) without filling to 0 baseline
                bands: [
                    { series: [3, 4], fill: "rgba(168, 85, 247, 0.15)" }
                ],
                series: [
                    {
                        label: "Time",
                        value: (u, val) => val != null ? new Date(val * 1000).toISOString().substr(11, 12) : '-'
                    },
                    {
                        label: "Raw (Tared)",
                        stroke: "#3b82f6",
                        width: 1,
                        value: (u, val) => val != null ? val.toFixed(4) : '-'
                    },
                    {
                        label: "Moving Average",
                        stroke: "#f97316",
                        width: 2,
                        value: (u, val) => val != null ? val.toFixed(4) : '-'
                    },
                    {
                        label: "Spread Upper",
                        stroke: "transparent",
                        width: 0,
                        value: (u, val) => val != null ? val.toFixed(4) : '-'
                    },
                    {
                        label: "Spread Lower",
                        stroke: "transparent",
                        width: 0,
                        fill: state.fillZeroToLower ? "rgba(168, 85, 247, 0.08)" : null,
                        value: (u, val) => val != null ? val.toFixed(4) : '-'
                    }
                ],
                plugins: [wheelZoomPlugin()],
                hooks: {
                    setSelect: [
                        (u) => {
                            const minX = u.posToVal(u.select.left, 'x');
                            const maxX = u.posToVal(u.select.left + u.select.width, 'x');
                            if (maxX > minX) {
                                state.isLive = false;
                                state.isPaused = true;
                                elLive.style.background = "#475569";
                                elPause.textContent = "Resume UI";
                                elPause.style.background = "#eab308";
                                u.setScale('x', { min: minX, max: maxX });
                            }
                        }
                    ],
                    setScale: [
                        (u, key) => {
                            if (key === 'x' && navPlot) {
                                const minX = u.scales.x.min;
                                const maxX = u.scales.x.max;
                                const left = navPlot.valToPos(minX, 'x');
                                const right = navPlot.valToPos(maxX, 'x');
                                navPlot.setSelect({
                                    left: left,
                                    width: right - left,
                                    top: 0,
                                    height: navPlot.bbox.height
                                }, false);
                            }
                        }
                    ],
					drawAxes: [
						(u) => {
							let ctx = u.ctx;
							let y0 = u.valToPos(0, 'y', true); // Get canvas Y pixel coordinate for value 0

							// Ensure the 0-line is within the visible plotting area bounds
							if (y0 >= u.bbox.top && y0 <= u.bbox.top + u.bbox.height) {
								ctx.save();
								ctx.strokeStyle = "#FFFFFF50"; 		// #38bdf8 Bright accent color (Sky blue)
								ctx.lineWidth = 1;           // Fat line thickness
								ctx.beginPath();
								ctx.moveTo(u.bbox.left, y0);
								ctx.lineTo(u.bbox.left + u.bbox.width, y0);
								ctx.stroke();
								ctx.restore();
							}
						}
					]
                }
            };

            mainPlot = new uPlot(mainOpts, [t, raw, ma, upper, lower], mainContainer);
        }

        function initNavChart() {
            const [t, raw] = computeDerivedData();
            const navContainer = document.getElementById('nav-chart');

            const navOpts = {
                width: navContainer.clientWidth || 800,
                height: navContainer.clientHeight || 50,
                scales: { x: { time: true }, y: { auto: true } },
                series: [{}, { stroke: "#64748b", width: 1 }],
                axes: [{ show: false }, { show: false }],
                cursor: { show: false },
                legend: { show: false },
                select: {
                    show: true,
                    over: true,
                    fill: "rgba(59, 130, 246, 0.3)"
                },
                hooks: {
                    setSelect: [
                        (u) => {
                            const minX = u.posToVal(u.select.left, 'x');
                            const maxX = u.posToVal(u.select.left + u.select.width, 'x');
                            if (maxX > minX) {
                                state.isLive = false;
                                state.isPaused = true;
                                elLive.style.background = "#475569";
                                elPause.textContent = "Resume UI";
                                elPause.style.background = "#eab308";
                                mainPlot.setScale('x', { min: minX, max: maxX });
                            }
                        }
                    ]
                }
            };

            navPlot = new uPlot(navOpts, [t, raw], navContainer);
        }

        function initCharts() {
            createMainPlot();
            initNavChart();
        }

        function updateVisualizations() {
            if (!mainPlot || !navPlot) return;
            const data = computeDerivedData();

            navPlot.setData([data[0], data[1]], true);
            mainPlot.setData(data, false);

            if (state.isLive && data[0].length > 0) {
                const maxT = data[0][data[0].length - 1];
                const minT = Math.max(data[0][0], maxT - state.liveWindowSpan);
                mainPlot.setScale('x', { min: minT, max: maxT });
            } else {
                const minX = mainPlot.scales.x.min;
                const maxX = mainPlot.scales.x.max;
                const left = navPlot.valToPos(minX, 'x');
                const right = navPlot.valToPos(maxX, 'x');
                navPlot.setSelect({
                    left: left,
                    width: right - left,
                    top: 0,
                    height: navPlot.bbox.height
                }, false);
            }

            if (state.manualY) {
                mainPlot.setScale('y', { min: state.yMin, max: state.yMax });
            }
        }

        // Event Listeners
        elLimit.addEventListener('change', (e) => {
            const val = parseInt(e.target.value, 10);
            if (val > 0) resizeBuffers(val);
        });

        elWindow.addEventListener('input', (e) => {
            state.windowSize = parseInt(e.target.value, 10) || 1;
        });

        elTare.addEventListener('input', (e) => {
            state.tareOffset = parseFloat(e.target.value) || 0;
        });

        elPause.addEventListener('click', () => {
            state.isPaused = !state.isPaused;
            elPause.textContent = state.isPaused ? "Resume UI" : "Pause UI";
            elPause.style.background = state.isPaused ? "#eab308" : "var(--accent-color)";
        });

        elLive.addEventListener('click', () => {
            state.isLive = true;
            state.isPaused = false;
            elPause.textContent = "Pause UI";
            elPause.style.background = "var(--accent-color)";
            elLive.style.background = "var(--accent-color)";
        });

        elAutoTare.addEventListener('click', () => {
            if (bufferLength > 0) {
                const [, , ma] = computeDerivedData();
                state.tareOffset = ma[bufferLength - 1];
                elTare.value = state.tareOffset.toFixed(4);
            }
        });

        elExport.addEventListener('click', () => {
            let csv = "Time_s,RawValue\n";
            for (let i = 0; i < bufferLength; i++) {
                csv += `${timesBuffer[i].toFixed(4)},${rawValuesBuffer[i].toFixed(4)}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sensor_data_${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        elFillZero.addEventListener('change', (e) => {
            state.fillZeroToLower = e.target.checked;
            // Re-initialize main chart to update series fill property config cleanly
            const mc = document.getElementById('main-chart');
            mc.innerHTML = "";
            createMainPlot();
        });

        elManualY.addEventListener('change', (e) => {
            state.manualY = e.target.checked;
            elRngYMin.disabled = !state.manualY;
            elRngYMax.disabled = !state.manualY;
            if (state.manualY && mainPlot) {
                mainPlot.setScale('y', { min: state.yMin, max: state.yMax });
            }
        });

        elRngYMin.addEventListener('input', (e) => {
            state.yMin = parseFloat(e.target.value);
            if (state.yMin >= state.yMax) {
                state.yMin = state.yMax - 1;
                e.target.value = state.yMin;
            }
            lblYMin.textContent = state.yMin;
            if (state.manualY && mainPlot) {
                mainPlot.setScale('y', { min: state.yMin, max: state.yMax });
            }
        });

        elRngYMax.addEventListener('input', (e) => {
            state.yMax = parseFloat(e.target.value);
            if (state.yMax <= state.yMin) {
                state.yMax = state.yMin + 1;
                e.target.value = state.yMax;
            }
            lblYMax.textContent = state.yMax;
            if (state.manualY && mainPlot) {
                mainPlot.setScale('y', { min: state.yMin, max: state.yMax });
            }
        });

        window.addEventListener('resize', () => {
            if (mainPlot && navPlot) {
                const mc = document.getElementById('main-chart');
                const nc = document.getElementById('nav-chart');
                mainPlot.setSize({ width: mc.clientWidth, height: mc.clientHeight });
                navPlot.setSize({ width: nc.clientWidth, height: nc.clientHeight });
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            statLimit.textContent = state.maxBufferSize;
            let simTime = 0;
            let lastVal = 0;
            for (let i = 0; i < 200; i++) {
                simTime += 0.0125;
                lastVal += (Math.random() - 0.49) * 2.5;
                pushSample(simTime, lastVal);
            }
            initCharts();

            let runningTime = simTime;
            setInterval(() => {
                runningTime += 0.0125;
                lastVal += (Math.random() - 0.49) * 2.5;

                pushSample(runningTime, lastVal);

                if (!state.isPaused) {
                    updateVisualizations();
                }
            }, 12.5);
        });
    </script>
</body>
</html>
