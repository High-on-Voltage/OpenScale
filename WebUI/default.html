<!--

  Sensor Live-Data Dashboard (80 Hz High-Performance uPlot Implementation)
  Features: Live Tracking, O(N) Processing Pipeline, Fixed Area Bands,
            Monospaced Non-Shaking Legend, Manual Y-Axis & Timeline Navigator
  Created by: AI Collaborator (Gemini)
  License: GNU AGPLv3
  ========================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Data Dashboard - AGPL Stable Edition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 20px;
        }
        .container {
            max-width: 1150px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #aaa;
        }
        input[type="number"], button {
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover {
            background: #3d3d3d;
        }
        .btn-live { background: #2e7d32; border-color: #4caf50; }
        .btn-live.tracking { box-shadow: 0 0 10px #4caf50; position: relative; }
        .btn-live.tracking::after { content: ' ●'; color: #2ff73c; animation: blink 1s infinite; }
        .btn-pause { background: #0288d1; border-color: #03a9f4; }
        .btn-pause.paused { background: #c62828; border-color: #f44336; }

        .settings-panel {
            display: flex;
            gap: 15px;
            background: #1e1e1e;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .settings-panel label {
            flex-direction: row;
            align-items: center;
            cursor: pointer;
            color: #fff;
        }
        .settings-panel input { cursor: pointer; margin-right: 6px; }

        .main-layout {
            display: flex;
            gap: 15px;
            align-items: stretch;
        }

        .chart-workspace {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }

        .chart-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            padding-bottom: 50px;
        }

        .navigator-container {
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .y-controls-sidebar {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 110px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .v-slider {
            height: 180px;
            writing-mode: vertical-lr;
            direction: rtl;
            appearance: slider-vertical;
            background: #2d2d2d;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .stats-panel {
            margin-left: auto;
            text-align: right;
            font-size: 13px;
            color: #888;
            display: flex;
            gap: 15px;
        }
        .stats-panel strong { color: #fff; }

        .u-legend th, .u-legend td {
            font-family: "Courier New", Courier, monospace !important;
            font-weight: bold;
            display: inline-block;
        }
        .u-legend th { width: 110px; text-align: left; color: #aaa; }
        .u-legend td { width: 75px; text-align: right; margin-right: 15px; }
        .u-legend .u-series { display: inline-block !important; margin-right: 20px; }
        .u-legend { bottom: 12px !important; top: auto !important; position: absolute !important; left: 20px; width: 95%; }

        #chartNav .u-legend { display: none !important; }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Sensor Live Data Dashboard</h2>

    <div class="controls">
        <label>
            Moving Average Window:
            <input type="number" id="maWindow" value="40" min="1" max="5000">
        </label>
        <label>
            Max. Buffer Size:
            <input type="number" id="maxBufferInput" value="100000" min="5000" step="5000">
        </label>

        <div class="group">
            <label>
                Tare Value (Offset):
                <input type="number" id="tareManual" value="0.00" step="0.1">
            </label>
            <button id="tareBtn">Auto-Tare</button>
        </div>

        <div class="group">
            <button id="liveBtn" class="btn-live tracking">Track Live</button>
            <button id="pauseBtn" class="btn-pause">Pause</button>
            <button id="exportBtn">CSV Export</button>
        </div>

        <div class="stats-panel">
            <div>Buffer: <strong id="bufferCount">0</strong> / <strong id="bufferMaxDisplay">100000</strong></div>
        </div>
    </div>

    <div class="settings-panel">
        <span style="font-weight:bold; color:#aaa; margin-right:10px;">Options:</span>
        <label><input type="checkbox" id="toggleFillArea" checked> Fill Variance Band Area</label>
    </div>

    <div class="main-layout">
        <div class="chart-workspace">
            <div class="chart-container">
                <div id="chartMain"></div>
            </div>

            <div class="navigator-container">
                <div id="chartNav"></div>
            </div>
        </div>

        <div class="y-controls-sidebar">
            <span style="font-size: 11px; font-weight: bold; text-align: center; color: #aaa;">Y-Axis Setup</span>
            <label style="flex-direction: row; gap: 5px; justify-content: center;">
                <input type="checkbox" id="toggleManualY"> Manual Y
            </label>
            <label style="align-items: center;">
                Zoom Y
                <input type="range" id="yZoomSlider" class="v-slider" min="10" max="400" value="100" disabled>
            </label>
            <label style="align-items: center;">
                Scroll Y
                <input type="range" id="yScrollSlider" class="v-slider" min="-100" max="100" value="0" disabled>
            </label>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.iife.min.js"></script>

<script>
    const rawBuffer = { times: [], values: [] };
    let startTimeStamp = null;

    let maWindowSize = parseInt(document.getElementById('maWindow').value, 10);
    let maxBufferSize = parseInt(document.getElementById('maxBufferInput').value, 10);
    let tareOffset = 0;

    let isPaused = false;
    let isTrackingLive = true;
    let liveViewportSize = 800;

    let isManualY = false;
    let baseManualYRange = 100;

    const maInput = document.getElementById('maWindow');
    const maxBufferInput = document.getElementById('maxBufferInput');
    const tareManual = document.getElementById('tareManual');
    const tareBtn = document.getElementById('tareBtn');
    const liveBtn = document.getElementById('liveBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const exportBtn = document.getElementById('exportBtn');
    const bufferCount = document.getElementById('bufferCount');
    const bufferMaxDisplay = document.getElementById('bufferMaxDisplay');
    const toggleFillArea = document.getElementById('toggleFillArea');

    const toggleManualY = document.getElementById('toggleManualY');
    const yZoomSlider = document.getElementById('yZoomSlider');
    const yScrollSlider = document.getElementById('yScrollSlider');

    maInput.addEventListener('input', (e) => { const val = parseInt(e.target.value, 10); if (val > 0) maWindowSize = val; });
    maxBufferInput.addEventListener('input', (e) => { const val = parseInt(e.target.value, 10); if (val >= 5000) { maxBufferSize = val; bufferMaxDisplay.textContent = val; }});

    tareManual.addEventListener('input', (e) => { tareOffset = parseFloat(e.target.value) || 0; });
    tareBtn.addEventListener('click', () => {
        if (rawBuffer.values.length > 0) {
            tareOffset = rawBuffer.values[rawBuffer.values.length - 1];
            tareManual.value = tareOffset.toFixed(2);
        }
    });

    liveBtn.addEventListener('click', () => {
        isTrackingLive = true;
        liveBtn.classList.add('tracking');
    });

    pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? "Resume" : "Pause";
pauseBtn.classList.toggle('paused', isPaused);
});
exportBtn.addEventListener('click', exportToCSV);
toggleFillArea.addEventListener('change', () => {
if (!chartMain || !chartMain.bands || chartMain.bands.length === 0) return;
// Correct uPlot runtime property modification via internal references
chartMain.bands[0].fill = toggleFillArea.checked ? "rgba(255, 183, 77, 0.18)" : "transparent";
chartMain.redraw();
});
toggleManualY.addEventListener('change', (e) => {
isManualY = e.target.checked;
yZoomSlider.disabled = !isManualY;
yScrollSlider.disabled = !isManualY;
updateVerticalScale();
});
yZoomSlider.addEventListener('input', updateVerticalScale);
yScrollSlider.addEventListener('input', updateVerticalScale);
function updateVerticalScale() {
if (!chartMain) return;
if (!isManualY) {
chartMain.setScale("y", { auto: true });
} else {
const zoomPercent = parseInt(yZoomSlider.value, 10) / 100;
const centerShift = parseFloat(yScrollSlider.value);
const span = baseManualYRange / zoomPercent;
chartMain.setScale("y", { min: centerShift - (span / 2), max: centerShift + (span / 2) });
}
}
function prepareChartData() {
const t = rawBuffer.times;
const vRaw = rawBuffer.values;
const len = vRaw.length;
const vTared = [];
const vMA = [];
const vBandUpper = [];
const vBandLower = [];
let windowSum = 0;
let windowSumSq = 0;
for (let i = 0; i < len; i++) {
const currentTared = vRaw[i] - tareOffset;
vTared.push(currentTared);
windowSum += currentTared;
windowSumSq += currentTared * currentTared;
if (i >= maWindowSize) {
const oldVal = vTared[i - maWindowSize];
windowSum -= oldVal;
windowSumSq -= oldVal * oldVal;
}
const currentWindowSize = Math.min(i + 1, maWindowSize);
const avg = windowSum / currentWindowSize;
vMA.push(avg);
let variance = (windowSumSq / currentWindowSize) - (avg * avg);
if (variance < 0) variance = 0;
const stdDev = Math.sqrt(variance);
vBandUpper.push(avg + stdDev);
vBandLower.push(avg - stdDev);
}
return [t, vTared, vMA, vBandUpper, vBandLower];
}
function wheelZoomPlugin() {
return {
hooks: {
init: u => {
u.root.querySelector(".u-over").addEventListener("wheel", e => {
e.preventDefault();
let factor = e.deltaY < 0 ? 0.85 : 1.15;
liveViewportSize = Math.max(80, Math.min(20000, Math.round(liveViewportSize * factor)));
if (isTrackingLive) {
updateChartViewport();
} else {
let currentMin = u.scales.x.min;
let currentMax = u.scales.x.max;
let center = (currentMin + currentMax) / 2;
let timeSpan = (currentMax - currentMin) * factor;
chartMain.setScale("x", { min: center - timeSpan/2, max: center + timeSpan/2 });
}
});
}
}
};
}
const legendValueFormatter = (u, val) => val != null ? val.toFixed(2) : "---";
const mainOpts = {
width: 1020,
height: 410,
ms: 1,
plugins: [wheelZoomPlugin()],
scales: {
x: { time: false },
y: { auto: (u, resetScale) => !isManualY }
},
series: [
{ label: "Time (s)", value: (u, v) => v != null ? v.toFixed(2) + "s" : "---" },
{ label: "Sensor", stroke: "#4fc3f7", width: 1, value: legendValueFormatter },
{ label: "Average", stroke: "#ffb74d", width: 2.5, value: legendValueFormatter },
{ label: "High Dev", stroke: "rgba(255, 183, 77, 0.4)", width: 1, value: legendValueFormatter },
{ label: "Low Dev", stroke: "rgba(255, 183, 77, 0.4)", width: 1, value: legendValueFormatter }
],
// Safely map bands indexing without web markdown renderer interruptions
bands: [ { series: [3,4], fill: "rgba(255, 183, 77, 0.18)", dir: 1 } ],
axes: [ { grid: { stroke: "#2d2d2d" }, stroke: "#888" }, { grid: { stroke: "#2d2d2d" }, stroke: "#888" } ],
cursor: { drag: { setScale: false, x: false, y: false } }
};
const navOpts = {
width: 1020,
height: 70,
ms: 1,
scales: { x: { time: false } },
axes: [ { show: false }, { show: false } ],
cursor: { y: false, points: { show: false } },
select: { over: true },
series: [
{},
{ stroke: "#3d7d9d", width: 1.5 }
],
hooks: {
setSelect: [
u => {
let select = u.select;
if (select.width > 0 && chartMain) {
isTrackingLive = false;
liveBtn.classList.remove('tracking');
let minX = u.posToVal(select.left, "x");
let maxX = u.posToVal(select.left + select.width, "x");
chartMain.setScale("x", { min: minX, max: maxX });
}
}
]
}
};
let chartMain = new uPlot(mainOpts, [[], [], [], [], []], document.getElementById("chartMain"));
let chartNav = new uPlot(navOpts, [[], []], document.getElementById("chartNav"));
function updateChartViewport() {
if (!isTrackingLive || rawBuffer.times.length === 0 || !chartNav || !chartNav.boxed) return;
const lastTime = rawBuffer.times[rawBuffer.times.length - 1];
const startIdx = Math.max(0, rawBuffer.times.length - liveViewportSize);
const startTime = rawBuffer.times[startIdx];
chartMain.setScale("x", { min: startTime, max: lastTime });
let selectLeft = chartNav.valToPos(startTime, "x");
let selectWidth = chartNav.valToPos(lastTime, "x") - selectLeft;
chartNav.setSelect({ left: selectLeft, width: selectWidth, top: 0, height: chartNav.boxed.height }, false);
}
function updateChart() {
if (isPaused) return;
const updatedData = prepareChartData();
chartMain.setData(updatedData, false);
// Pass the timeline data matrix into the sub preview component context mapping
chartNav.setData([updatedData[0], updatedData[1]], false);
if (isTrackingLive) {
updateChartViewport();
}
if (isManualY) {
updateVerticalScale();
}
}
function handleIncomingData(timestamp, value) {
if (startTimeStamp === null) startTimeStamp = timestamp;
const elapsedSeconds = timestamp - startTimeStamp;
rawBuffer.times.push(elapsedSeconds);
rawBuffer.values.push(value);
if (rawBuffer.times.length > maxBufferSize) {
rawBuffer.times.shift();
rawBuffer.values.shift();
}
bufferCount.textContent = rawBuffer.times.length;
updateChart();
}
function exportToCSV() {
if (rawBuffer.times.length === 0) return alert("No active data records captured.");
let csv = "Relative_Seconds,Raw_Value\n";
for (let i = 0; i < rawBuffer.times.length; i++) {
//csv += ${rawBuffer.times[i].toFixed(3)},${rawBuffer.values[i].toFixed(4)}\n;
}
const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
const link = document.createElement("a");
link.href = URL.createObjectURL(blob);
//link.setAttribute("download", sensor_data_${Math.floor(Date.now()/1000)}.csv);
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
function startSimulation() {
let count = 0;
setInterval(() => {
const now = Date.now() / 1000;
const base = 120 + Math.sin(count * 0.02) * 25;
const noise = (Math.random() - 0.5) * 15;
handleIncomingData(now, base + noise);
count++;
}, 1000 / 80);
}
startSimulation();

        const data = JSON.parse(event.data);
        const now = Date.now() / 1000;
        handleIncomingData(now, parseFloat(data.value));
    };
    */
</script>
</body>
</html>
