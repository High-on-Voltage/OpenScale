<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Data Dashboard - Ultra Performance & Bands Fix</title>
    <!-- uPlot CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        label {
            font-size: 12px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #aaa;
        }
        input[type="number"], button {
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover {
            background: #3d3d3d;
        }
        .btn-live { background: #2e7d32; border-color: #4caf50; }
        .btn-live.tracking { box-shadow: 0 0 10px #4caf50; position: relative; }
        .btn-live.tracking::after { content: ' ●'; color: #2ff73c; animation: blink 1s infinite; }
        .btn-pause { background: #0288d1; border-color: #03a9f4; }
        .btn-pause.paused { background: #c62828; border-color: #f44336; }

        .toggles {
            display: flex;
            gap: 15px;
            background: #1e1e1e;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .toggles label {
            flex-direction: row;
            align-items: center;
            cursor: pointer;
            color: #fff;
        }
        .toggles input { cursor: pointer; margin-right: 6px; }

        .chart-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .timeline-slider-container {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .timeline-slider {
            flex-grow: 1;
            background: #2d2d2d;
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }
        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #4fc3f7;
            cursor: pointer;
        }

        .stats-panel {
            margin-left: auto;
            text-align: right;
            font-size: 13px;
            color: #888;
            display: flex;
            gap: 15px;
        }
        .stats-panel strong { color: #fff; }
        .u-legend th { color: #aaa; }
        .u-legend { bottom: -35px !important; top: auto !important; }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Sensor Live-Daten (80 Hz)</h2>

    <div class="controls">
        <label>
            Moving Average Fenster:
            <input type="number" id="maWindow" value="40" min="1" max="5000">
        </label>
        <label>
            Max. Buffer-Größe (Werte):
            <input type="number" id="maxBufferInput" value="100000" min="5000" step="5000">
        </label>

        <div class="group">
            <label>
                Tare-Wert (Offset):
                <input type="number" id="tareManual" value="0.00" step="0.1">
            </label>
            <button id="tareBtn">Auto-Tare</button>
        </div>

        <div class="group">
            <button id="liveBtn" class="btn-live tracking">Live verfolgen</button>
            <button id="pauseBtn" class="btn-pause">Pause</button>
            <button id="exportBtn">CSV Export</button>
        </div>

        <div class="stats-panel">
            <div>Buffer: <strong id="bufferCount">0</strong> / <strong id="bufferMaxDisplay">100000</strong></div>
        </div>
    </div>

    <div class="toggles">
        <span style="font-weight:bold; color:#aaa; margin-right:10px;">Sichtbarkeit:</span>
        <label><input type="checkbox" id="toggleRaw" checked> Sensorwert (Blau)</label>
        <label><input type="checkbox" id="toggleMA" checked> Moving Average (Orange)</label>
        <label><input type="checkbox" id="toggleBand" checked> Streuungsband (Fläche)</label>
    </div>

    <div class="chart-container">
        <div id="chart"></div>
        <div class="timeline-slider-container">
            <span style="font-size:12px; color:#aaa;">Historie scrollen:</span>
            <input type="range" id="historyScroll" class="timeline-slider" min="0" max="100" value="100" disabled>
        </div>
    </div>
</div>

<!-- uPlot JS -->
<script src="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.iife.min.js"></script>

<script>
    // --- Globaler Speicherbuffer (Unverändert) ---
    const rawBuffer = { times: [], values: [] };

    // Konfigurations-State
    let maWindowSize = parseInt(document.getElementById('maWindow').value, 10);
    let maxBufferSize = parseInt(document.getElementById('maxBufferInput').value, 10);
    let tareOffset = 0;

    // Navigations- & Steuerungs-State
    let isPaused = false;
    let isTrackingLive = true;
    let liveViewportSize = 800; // Breite des Sichtbereichs (~10 Sekunden)

    // --- DOM Referenzen ---
    const maInput = document.getElementById('maWindow');
    const maxBufferInput = document.getElementById('maxBufferInput');
    const tareManual = document.getElementById('tareManual');
    const tareBtn = document.getElementById('tareBtn');
    const liveBtn = document.getElementById('liveBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const exportBtn = document.getElementById('exportBtn');
    const bufferCount = document.getElementById('bufferCount');
    const bufferMaxDisplay = document.getElementById('bufferMaxDisplay');
    const historyScroll = document.getElementById('historyScroll');

    const toggleRaw = document.getElementById('toggleRaw');
    const toggleMA = document.getElementById('toggleMA');
    const toggleBand = document.getElementById('toggleBand');

    // --- Event Listener ---
    maInput.addEventListener('input', (e) => { const val = parseInt(e.target.value, 10); if (val > 0) maWindowSize = val; });
    maxBufferInput.addEventListener('input', (e) => { const val = parseInt(e.target.value, 10); if (val >= 5000) { maxBufferSize = val; bufferMaxDisplay.textContent = val; }});

    tareManual.addEventListener('input', (e) => { tareOffset = parseFloat(e.target.value) || 0; });
    tareBtn.addEventListener('click', () => {
        if (rawBuffer.values.length > 0) {
            tareOffset = rawBuffer.values[rawBuffer.values.length - 1];
            tareManual.value = tareOffset.toFixed(2);
        }
    });

    liveBtn.addEventListener('click', () => {
        isTrackingLive = true;
        liveBtn.classList.add('tracking');
        historyScroll.value = historyScroll.max;
    });

    pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        pauseBtn.textContent = isPaused ? "Fortsetzen" : "Pause";
        pauseBtn.classList.toggle('paused', isPaused);
    });

    exportBtn.addEventListener('click', exportToCSV);

    // Graphen-Sichtbarkeits-Toggles
    toggleRaw.addEventListener('change', () => { chart.setSeries(1, { show: toggleRaw.checked }); });
    toggleMA.addEventListener('change', () => { chart.setSeries(2, { show: toggleMA.checked }); });
    toggleBand.addEventListener('change', () => {
        chart.setSeries(3, { show: toggleBand.checked });
        chart.setSeries(4, { show: toggleBand.checked });
    });

    historyScroll.addEventListener('input', (e) => {
        if (rawBuffer.times.length <= liveViewportSize) return;
        isTrackingLive = false;
        liveBtn.classList.remove('tracking');

        const val = parseInt(e.target.value, 10);
        const maxScrollIdx = rawBuffer.times.length - liveViewportSize;
        const targetIdx = Math.round((val / 100) * maxScrollIdx);

        const startX = rawBuffer.times[targetIdx];
        const endX = rawBuffer.times[targetIdx + liveViewportSize - 1];
        chart.setScale("x", { min: startX, max: endX });
    });

    // --- Hoch-optimierte Data Pipeline (O(N) Komplexität) ---
    function prepareChartData() {
        const t = rawBuffer.times;
        const vRaw = rawBuffer.values;
        const len = vRaw.length;

        const vTared = new Float64Array(len);
        const vMA = new Float64Array(len);
const vBandUpper = new Float64Array(len);
const vBandLower = new Float64Array(len);
let windowSum = 0;
let windowSumSq = 0;
for (let i = 0; i < len; i++) {
const currentTared = vRaw[i] - tareOffset;
vTared[i] = currentTared;
windowSum += currentTared;
windowSumSq += currentTared * currentTared;
if (i >= maWindowSize) {
const oldVal = vTared[i - maWindowSize];
windowSum -= oldVal;
windowSumSq -= oldVal * oldVal;
}
const currentWindowSize = Math.min(i + 1, maWindowSize);
const avg = windowSum / currentWindowSize;
vMA[i] = avg;
let variance = (windowSumSq / currentWindowSize) - (avg * avg);
if (variance < 0) variance = 0;
const stdDev = Math.sqrt(variance);
vBandUpper[i] = avg + stdDev;
vBandLower[i] = avg - stdDev;
}
return [t, vTared, vMA, vBandUpper, vBandLower];
}
// --- Mausrad Zoom-Plugin ---
function wheelZoomPlugin() {
return {
hooks: {
init: u => {
u.root.querySelector(".u-over").addEventListener("wheel", e => {
e.preventDefault();
let factor = e.deltaY < 0 ? 0.85 : 1.15;
liveViewportSize = Math.max(80, Math.min(20000, Math.round(liveViewportSize * factor)));
if (isTrackingLive) {
updateChartViewport();
} else {
let currentMin = u.scales.x.min;
let currentMax = u.scales.x.max;
let center = (currentMin + currentMax) / 2;
let timeSpan = (currentMax - currentMin) * factor;
chart.setScale("x", { min: center - timeSpan/2, max: center + timeSpan/2 });
}
});
}
}
};
}
// --- uPlot Konfiguration ---
const opts = {
width: 1060,
height: 430,
ms: 1,
plugins: [wheelZoomPlugin()],
series: [
{}, // X-Achse (Index 0)
{ label: "Sensor (Tared)", stroke: "#4fc3f7", width: 1, show: true }, // Index 1
{ label: "Moving Average", stroke: "#ffb74d", width: 2.5, show: true }, // Index 2
// BUGFIX: Die Hüllkurven dürfen NICHT transparent sein oder Breite 0 haben,
// da uPlot sonst das Zeichnen abbricht. Sie erhalten die Farbe der Füllung mit minimaler Linienstärke.
{ label: "Streuung Oben", stroke: "rgba(255, 183, 77, 0.22)", width: 0.1, show: true }, // Index 3
{ label: "Streuung Unten", stroke: "rgba(255, 183, 77, 0.22)", width: 0.1, show: true } // Index 4
],
// Das funktionierende Bands-Array nutzt nun die korrekten Indizes [3, 4]
bands: [
{ series: [3,4], fill: "rgba(255, 183, 77, 0.18)", dir: 1 }
],
axes: [
{ grid: { stroke: "#2d2d2d" }, stroke: "#888" },
{ grid: { stroke: "#2d2d2d" }, stroke: "#888" }
],
cursor: { drag: { setScale: false, x: false, y: false } }
};
const chartDiv = document.getElementById("chart");
let chart = new uPlot(opts, [[], [], [], [], []], chartDiv);
// --- Viewport & Render-Schleife ---
function updateChartViewport() {
if (!isTrackingLive || rawBuffer.times.length === 0) return;
const lastTime = rawBuffer.times[rawBuffer.times.length - 1];
const startIdx = Math.max(0, rawBuffer.times.length - liveViewportSize);
const startTime = rawBuffer.times[startIdx];
chart.setScale("x", { min: startTime, max: lastTime });
}
function updateChart() {
if (isPaused) return;
const updatedData = prepareChartData();
chart.setData(updatedData, false);
if (isTrackingLive) {
updateChartViewport();
}
}
// --- Live-Daten-Schnittstelle (SSE) ---
function handleIncomingData(timestamp, value) {
rawBuffer.times.push(timestamp);
rawBuffer.values.push(value);
if (rawBuffer.times.length > maxBufferSize) {
rawBuffer.times.shift();
rawBuffer.values.shift();
}
bufferCount.textContent = rawBuffer.times.length;
if (rawBuffer.times.length > liveViewportSize) {
historyScroll.disabled = false;
if (isTrackingLive) {
historyScroll.value = historyScroll.max;
}
}
updateChart();
}
// --- CSV Export (Fehlerbereinigt mit echten Backticks) ---
function exportToCSV() {
if (rawBuffer.times.length === 0) return alert("Keine Daten vorhanden.");
let csv = "Timestamp_Unix,Raw_Value\n";
for (let i = 0; i < rawBuffer.times.length; i++) {
csv += `${rawBuffer.times[i]},${rawBuffer.values[i]}\n`;
}
const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
const link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.setAttribute("download", `sensor_data_${Math.floor(Date.now()/1000)}.csv`);
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}
// --- SSE-Simulator (80 Hz) ---
function startSimulation() {
let count = 0;
setInterval(() => {
const now = Date.now() / 1000;
const base = 120 + Math.sin(count * 0.02) * 25;
const noise = (Math.random() - 0.5) * 15;
handleIncomingData(now, base + noise);
count++;
}, 1000 / 80);
}
startSimulation();

</script>
</body>
</html>
