<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Data Dashboard - Scroll & History Edition</title>
    <!-- uPlot CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 20px;
            user-select: none;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label {
            font-size: 13px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #aaa;
        }
        input, button {
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #4fc3f7;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s;
        }
        button:hover {
            background: #3d3d3d;
        }
        button.active {
            background: #d32f2f;
            border-color: #f44336;
        }
        .btn-pause {
            background: #0288d1;
            border-color: #03a9f4;
        }
        .btn-pause.paused {
            background: #388e3c;
            border-color: #4caf50;
        }
        .chart-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }
        .stats-panel {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
        .stats-panel strong {
            color: #fff;
        }
        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        /* Dark-Mode Overrides für die integrierte uPlot-Legende */
        .u-legend th { color: #aaa; }
        .u-legend { bottom: -30px !important; top: auto !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sensor Live-Daten (80 Hz)</h2>

    <div class="controls">
        <label>
            Moving Average Fenster:
            <input type="number" id="maWindow" value="40" min="1" max="5000">
        </label>
        <label>
            Max. Buffer-Größe (Werte):
            <input type="number" id="maxBufferInput" value="100000" min="5000" step="5000">
        </label>

        <button id="tareBtn">Tare (Nullpunkt)</button>
        <button id="pauseBtn" class="btn-pause">Pause (Chart einfrieren)</button>
        <button id="exportBtn">CSV Export</button>

        <div style="margin-left: auto; text-align: right;" class="stats-panel">
            <div>Offset: <strong id="offsetVal">0.00</strong></div>
            <div>Buffer: <strong id="bufferCount">0</strong> / <strong id="bufferMaxDisplay">100000</strong></div>
        </div>
    </div>

    <div class="chart-container">
        <div id="chart"></div>
    </div>
    <p class="hint">💡 <strong>Bedienung:</strong> Ziehe mit gedrückter Maustaste im Chart nach links/rechts, um in der Historie zu scrollen. Das Scrollen unterbricht das automatische Nach-Vorne-Springen im Live-Betrieb.</p>
</div>

<!-- uPlot JS (Vollständiger, korrekter CDN Link) -->
<script src="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.iife.min.js"></script>

<script>
    // --- State & Unveränderter Buffer ---
    const rawBuffer = {
        times: [],  // Unix-Zeitstempel in Sekunden
        values: []  // Unveränderte Rohwerte vom Sensor
    };

    // Konfigurationen
    let maWindowSize = parseInt(document.getElementById('maWindow').value, 10);
    let maxBufferSize = parseInt(document.getElementById('maxBufferInput').value, 10);
    let tareOffset = 0;

    // UI- & Interaktions-Flags
    let isPaused = false;
    let isUserScrolling = false;
    let userXRange = null; // Speichert den manuell verschobenen Sichtbereich

    // --- DOM Elemente & Event Listener ---
    const maInput = document.getElementById('maWindow');
    const maxBufferInput = document.getElementById('maxBufferInput');
    const tareBtn = document.getElementById('tareBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const exportBtn = document.getElementById('exportBtn');
    const offsetVal = document.getElementById('offsetVal');
    const bufferCount = document.getElementById('bufferCount');
    const bufferMaxDisplay = document.getElementById('bufferMaxDisplay');

    maInput.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        if (val > 0) maWindowSize = val;
    });

    maxBufferInput.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        if (val >= 5000) {
            maxBufferSize = val;
            bufferMaxDisplay.textContent = val;
        }
    });

    tareBtn.addEventListener('click', () => {
        if (rawBuffer.values.length > 0) {
            tareOffset = rawBuffer.values[rawBuffer.values.length - 1];
            offsetVal.textContent = tareOffset.toFixed(2);
            tareBtn.classList.add('active');
        }
    });

    pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
            pauseBtn.textContent = "Fortsetzen (Live)";
            pauseBtn.classList.add('paused');
        } else {
            pauseBtn.textContent = "Pause (Chart einfrieren)";
            pauseBtn.classList.remove('paused');
            isUserScrolling = false; // Reset des Scroll-Status beim Fortsetzen
            userXRange = null;
            updateChart();
        }
    });

    exportBtn.addEventListener('click', () => {
        exportToCSV();
    });

    // --- Datenverarbeitung & Transformation (On-the-Fly beim Rendern) ---
    function prepareChartData() {
        const t = rawBuffer.times;
        const vRaw = rawBuffer.values;

        const vTared = [];
        const vMA = [];
        const vBandUpper = [];
        const vBandLower = [];

        for (let i = 0; i < vRaw.length; i++) {
            // 1. Tare-Verschiebung anwenden
            const currentTared = vRaw[i] - tareOffset;
            vTared.push(currentTared);

            // 2. Moving Average im aktiven Schiebefenster berechnen
            const start = Math.max(0, i - maWindowSize + 1);
            const windowValues = vTared.slice(start, i + 1);
            const sum = windowValues.reduce((a, b) => a + b, 0);
            const avg = sum / windowValues.length;
            vMA.push(avg);

            // 3. Mittlere Streuung (Standardabweichung) berechnen
            const variance = windowValues.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / windowValues.length;
            const stdDev = Math.sqrt(variance);

            vBandUpper.push(avg + stdDev);
            vBandLower.push(avg - stdDev);
        }

        return [t, vTared, vMA, vBandUpper, vBandLower];
    }

    // --- uPlot Konfiguration ---
    // Plugin-Logik für freies Verschieben (Pan/Scroll) über die Achsen
    function dragPanPlugin() {
        return {
            hooks: {
                init: u => {
                    let plotBgc = u.root.querySelector(".u-over");

                    let startX;
                    let minX, maxX;

                    plotBgc.addEventListener("mousedown", e => {
                        if (e.button !== 0) return; // Nur linke Maustaste
                        isUserScrolling = true;

                        startX = e.clientX;
                        minX = u.valToPos(u.scales.x.min, "x");
                        maxX = u.valToPos(u.scales.x.max, "x");

                        function onMouseMove(e) {
                            let diffX = e.clientX - startX;

                            let newMinX = u.posToVal(minX - diffX, "x");
                            let newMaxX = u.posToVal(maxX - diffX, "x");

                            userXRange = [newMinX, newMaxX];

                            u.setScale("x", { min: newMinX, max: newMaxX });
                        }

                        function onMouseUp() {
                            document.removeEventListener("mousemove", onMouseMove);
                            document.removeEventListener("mouseup", onMouseUp);
                        }

                        document.addEventListener("mousemove", onMouseMove);
                        document.addEventListener("mouseup", onMouseUp);
                    });
                }
            }
        };
    }

    const opts = {
        title: "",
        width: 1060,
        height: 450,
        ms: 1,
        plugins: [dragPanPlugin()],
        series: [
            {},
            { label: "Sensor (Tared)", stroke: "#4fc3f7", width: 1 },
            { label: "Moving Average", stroke: "#ffb74d", width: 2.5 },
            { label: "Streuung Oberseite", stroke: "transparent", width: 0 },
            { label: "Streuung Unterseite", stroke: "transparent", width: 0, fill: "rgba(255, 183, 77, 0.12)" }
        ],
bands: [ {series: [3, 4]} ],
axes: [
{ grid: { stroke: "#2d2d2d" }, stroke: "#888" },
{ grid: { stroke: "#2d2d2d" }, stroke: "#888" }
],
cursor: {
drag: { setScale: false, x: false, y: false } // Deaktiviert uPlots Standard-Zoom-Box für unser Custom-Panning
}
};
const chartDiv = document.getElementById("chart");
let chart = new uPlot(opts, [[], [], [], [], []], chartDiv);
// --- UI Update Logik ---
function updateChart() {
if (isPaused) return;
const updatedData = prepareChartData();
chart.setData(updatedData, false); // Update Daten ohne Achsen-Reset
// Wenn der Nutzer nicht händisch scrollt, folgt der Viewport automatisch den neuesten 800 Werten (~10 Sek.)
if (!isUserScrolling && rawBuffer.times.length > 0) {
const lastTime = rawBuffer.times[rawBuffer.times.length - 1];
const startTime = rawBuffer.times[Math.max(0, rawBuffer.times.length - 800)];
chart.setScale("x", { min: startTime, max: lastTime });
} else if (userXRange) {
// Behalte den vom User gescrollten Bildausschnitt bei
chart.setScale("x", { min: userXRange[0], max: userXRange[1] });
}
}
// --- Daten-Injektion (Echtzeit-Verarbeitung von SSE) ---
function handleIncomingData(timestamp, value) {
rawBuffer.times.push(timestamp);
rawBuffer.values.push(value);
// Greift erst bei Erreichen des benutzerdefinierten Limits
if (rawBuffer.times.length > maxBufferSize) {
rawBuffer.times.shift();
rawBuffer.values.shift();
// Optional: User-X-Range korrigieren, falls der älteste Wert herausfällt
}
bufferCount.textContent = rawBuffer.times.length;
updateChart();
}
// --- CSV Export (Greift auf den vollständigen, unveränderten Rohdaten-Buffer zu) ---
function exportToCSV() {
    if (rawBuffer.times.length === 0) return alert("Keine Daten zum Exportieren vorhanden.");
    let csvContent = "data:text/csv;charset=utf-8,Timestamp_Unix,Raw_Value\n";
    for (let i = 0; i < rawBuffer.times.length; i++) {
        // csvContent += ${rawBuffer.times[i]},${rawBuffer.values[i]}\n;
    }
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
//link.setAttribute("download", sensor_data_raw_${Math.floor(Date.now()/1000)}.csv);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
// --- SSE Emulator (80 Hz) ---
function startSimulation() {
let count = 0;
const intervalMs = 1000 / 80;
setInterval(() => {
const now = Date.now() / 1000;
const baseValue = 100 + Math.sin(count * 0.03) * 20;
const noise = (Math.random() - 0.5) * 12;
const fakeSensorValue = baseValue + noise;
handleIncomingData(now, fakeSensorValue);
count++;
}, intervalMs);
}
startSimulation();

</script>
</body>
